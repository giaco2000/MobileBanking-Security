<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Banking - Login</title>
    <!-- Collegamento al CSS -->
    <link rel="stylesheet" href="/static/css/styles.css">
    <!-- Collegamento a Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="login-box">
            <h1>Benvenuto nella tua dashboard</h1>
            <p>Accedi utilizzando uno dei seguenti provider:</p>
            <div class="button-group">
                <button onclick="signInWithMicrosoft()" class="login-btn microsoft-btn">
                    <svg width="24" height="24" viewBox="0 0 21 21" xmlns="http://www.w3.org/2000/svg">
                        <rect x="1" y="1" width="9" height="9" fill="#F25022"/>
                        <rect x="11" y="1" width="9" height="9" fill="#7FBA00"/>
                        <rect x="1" y="11" width="9" height="9" fill="#00A4EF"/>
                        <rect x="11" y="11" width="9" height="9" fill="#FFB900"/>
                    </svg>
                    Accedi con Microsoft
                </button>
                
                <button onclick="signInWithGitHub()" class="login-btn github-btn">
                    <svg width="24" height="24" viewBox="0 0 24 24">
                        <path fill="currentColor" d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
                    </svg>
                    Accedi con GitHub
                </button>
            </div>
        </div>
    </div>

    <!-- Script per la gestione del login -->
    <script>
        // Configurazione MSAL per Microsoft
        const msalConfig = {
            auth: {
                clientId: '{{ microsoft_client_id }}',
                redirectUri: window.location.origin + "/login/microsoft/callback"
            }
        };
        
        const msalInstance = new msal.PublicClientApplication(msalConfig);

    
        function signInWithMicrosoft() {
            try {
                const loginButton = document.querySelector('.microsoft-btn');
                loginButton.style.opacity = '0.7';
                window.location.href = '/login/microsoft';
            } catch (error) {
            console.error('Errore durante l\'autenticazione Microsoft:', error);
            showError('Errore durante l\'autenticazione Microsoft');
            }
        }

        function signInWithGitHub() {
            try {
                const loginButton = document.querySelector('.github-btn');
                loginButton.style.opacity = '0.7';
                const client_id = '{{ github_client_id }}';
                const redirect_uri = encodeURIComponent(window.location.origin + '/login/github/callback');
                window.location.href = `https://github.com/login/oauth/authorize?client_id=${client_id}&redirect_uri=${redirect_uri}&scope=user:email`;
            } catch (error) {
                console.error('Errore durante l\'autenticazione GitHub:', error);
                showError('Errore durante l\'autenticazione GitHub');
            }
        }

        function showError(message) {
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error-toast';
            errorDiv.textContent = message;
            document.body.appendChild(errorDiv);

            setTimeout(() => {
                errorDiv.remove();
            }, 3000);
        }
    </script>
</body>
</html>
